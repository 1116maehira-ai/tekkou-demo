<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CMS管理画面 — 琉球鉄工</title>
<style>
:root {
  --red: #C8001E;
  --red-dark: #9A0016;
  --black: #111;
  --gray-dark: #333;
  --gray-mid: #666;
  --gray-light: #F5F5F5;
  --border: #E0E0E0;
  --white: #fff;
  --success: #16A34A;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: var(--gray-light); color: var(--black); min-height: 100vh; }

/* ヘッダー */
.header {
  background: var(--black);
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-mark { width: 28px; height: 28px; background: var(--red); display: flex; align-items: center; justify-content: center; clip-path: polygon(0 0,100% 0,100% 75%,85% 100%,0 100%); }
.header-mark span { color: white; font-size: 13px; font-weight: 700; }
.header-title { color: white; font-size: 14px; font-weight: 700; }
.header-title small { display: block; font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 400; }
.preview-btn {
  padding: 6px 14px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 12px;
  font-weight: 700;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* パンくず */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 16px;
  font-size: 12px;
  color: var(--gray-mid);
  background: white;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  white-space: nowrap;
}
.breadcrumb-item { cursor: pointer; color: var(--red); }
.breadcrumb-item.current { color: var(--gray-dark); cursor: default; }
.breadcrumb-sep { color: var(--border); }

/* メインコンテンツ */
.main { padding: 16px; max-width: 680px; margin: 0 auto; }

/* ページ選択 */
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--gray-mid);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.page-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 24px; }
.page-card {
  background: white;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
}
.page-card:active { transform: scale(0.97); }
.page-card.selected { border-color: var(--red); }
.page-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--red); opacity: 0; transition: opacity 0.15s; }
.page-card.selected::after { opacity: 1; }
.page-card-icon { font-size: 24px; margin-bottom: 8px; }
.page-card-name { font-size: 13px; font-weight: 700; }
.page-card-count { font-size: 10px; color: var(--gray-mid); margin-top: 4px; }

/* セクションリスト */
.section-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
.section-item {
  background: white;
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: border-color 0.15s;
  box-shadow: var(--shadow);
}
.section-item:active { transform: scale(0.99); }
.section-item-left { display: flex; align-items: center; gap: 12px; }
.section-icon { width: 36px; height: 36px; background: var(--gray-light); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.section-name { font-size: 14px; font-weight: 700; }
.section-desc { font-size: 11px; color: var(--gray-mid); margin-top: 2px; }
.section-arrow { color: var(--gray-mid); font-size: 18px; }
.section-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: var(--red); color: white; }

/* ブロック編集 */
.block-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.block-card {
  background: white;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.block-card-head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--gray-light);
}
.block-type { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--gray-mid); text-transform: uppercase; }
.block-type-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 700;
}
.block-type-badge.text { background: #EFF6FF; color: #1D4ED8; }
.block-type-badge.image { background: #F0FDF4; color: #15803D; }
.block-content { padding: 14px 16px; }
.block-current { font-size: 14px; line-height: 1.6; color: var(--black); margin-bottom: 12px; min-height: 40px; }
.block-current.empty { color: var(--gray-mid); font-style: italic; }
.block-actions { display: flex; gap: 8px; }
.btn-edit {
  flex: 1;
  padding: 10px;
  background: var(--black);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.15s;
}
.btn-edit:active { background: var(--gray-dark); }
.btn-ai {
  padding: 10px 14px;
  background: var(--red);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-ai:active { background: var(--red-dark); }

/* 編集モーダル */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: white;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  padding-bottom: env(safe-area-inset-bottom);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 16px; }
.modal-header { padding: 0 20px 16px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 16px; font-weight: 900; }
.modal-subtitle { font-size: 12px; color: var(--gray-mid); margin-top: 4px; }
.modal-body { padding: 20px; }

/* テキスト編集エリア */
.edit-textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  font-family: inherit;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
}
.edit-textarea:focus { border-color: var(--red); }

/* AI chat */
.ai-section { margin-top: 16px; }
.ai-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ai-chat { background: var(--gray-light); border-radius: 10px; padding: 12px; min-height: 80px; margin-bottom: 10px; max-height: 200px; overflow-y: auto; }
.ai-msg { font-size: 13px; line-height: 1.7; }
.ai-msg.assistant { color: var(--black); }
.ai-msg.user { color: var(--gray-mid); margin-bottom: 8px; }
.ai-msg.loading { color: var(--gray-mid); font-style: italic; }
.ai-input-row { display: flex; gap: 8px; }
.ai-input {
  flex: 1;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.ai-input:focus { border-color: var(--red); }
.ai-send {
  padding: 10px 16px;
  background: var(--red);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.ai-send:disabled { opacity: 0.5; }

/* 承認エリア */
.approve-area {
  margin-top: 20px;
  padding: 16px;
  background: #FFF8F8;
  border: 1px solid rgba(200,0,30,0.15);
  border-radius: 10px;
}
.approve-label { font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: 0.1em; margin-bottom: 8px; }
.approve-preview { font-size: 14px; line-height: 1.6; color: var(--black); margin-bottom: 14px; font-weight: 500; }
.approve-actions { display: flex; gap: 8px; }
.btn-approve {
  flex: 2;
  padding: 12px;
  background: var(--red);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.15s;
}
.btn-approve:active { background: var(--red-dark); }
.btn-approve:disabled { opacity: 0.5; }
.btn-cancel-modal {
  flex: 1;
  padding: 12px;
  background: var(--gray-light);
  color: var(--gray-dark);
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

/* トースト */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--black);
  color: white;
  padding: 12px 24px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  transition: all 0.3s;
  z-index: 999;
  white-space: nowrap;
  pointer-events: none;
}
.toast.success { background: var(--success); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ローディング */
.loading-screen {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  transition: opacity 0.3s;
}
.loading-screen.hide { opacity: 0; pointer-events: none; }
.spinner { width: 36px; height: 36px; border: 3px solid #eee; border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 空状態 */
.empty-state { text-align: center; padding: 48px 20px; color: var(--gray-mid); }
.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; line-height: 1.7; }

/* ステータスバー */
.status-bar {
  background: white;
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--gray-mid);
  position: sticky;
  bottom: 0;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; }

@media (min-width: 480px) {
  .page-grid { grid-template-columns: repeat(3,1fr); }
}
</style>
</head>

// ========== 設定 ==========
const SUPABASE_URL = 'https://umzrziidmnlpcvvomdaz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtenJ6aWlkbW5scGN2dm9tZGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NTU2MTgsImV4cCI6MjEwMTEzMTYxOH0.A5ktqJw_Ctmk11ZXgUyS9g9yqmBf5KU7kbeX05ZhwQs';

const CLAUDE_API = '/api/claude';

// ========== セクション定義 ==========

// ========== 状態管理 ==========
let state = {
  page: null,
  pageName: null,
  section: null,
  sectionName: null,
  allData: {},

  pendingValue: null
};

// ========== Supabase ==========
async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
      ...options.headers
    }
  });
  if (!res.ok) throw new Error('Supabase error: ' + res.status);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadAllData() {
  const data = await sbFetch('/rest/v1/site_contents?select=page,section,block_key,text_value,media_url,updated_at&order=updated_at.desc');
  state.allData = {};
  data.forEach(r => {
    const k = `${r.page}.${r.section}.${r.block_key}`;
    state.allData[k] = { text: r.text_value, media: r.media_url, updated_at: r.updated_at };
  });
  updateLastUpdated(data[0]?.updated_at);
}

function getValue(page, section, key) {
  return state.allData[`${page}.${section}.${key}`]?.text || '';
}

function getMediaValue(page, section, key) {
  return state.allData[`${page}.${section}.${key}`]?.media || '';
}

async function uploadMedia(event, blockKey, mediaType) {
  const file = event.target.files[0];
  if (!file) return;
  showToast('📤 アップロード中...', '');
  try {
    const ext = file.name.split('.').pop();
    const fileName = `${state.page}/${state.section}/${blockKey}_${Date.now()}.${ext}`;
    // Supabase Storageにアップロード
    const uploadRes = await fetch(
      `${SUPABASE_URL}/storage/v1/object/site-media/${fileName}`,
      {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': file.type,
          'x-upsert': 'true'
        },
        body: file
      }
    );
    if (!uploadRes.ok) throw new Error('Upload failed: ' + uploadRes.status);
    // 公開URLを生成
    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/site-media/${fileName}`;
    // DBのmedia_urlを更新
    await sbFetch(
      `/rest/v1/site_contents?page=eq.${state.page}&section=eq.${state.section}&block_key=eq.${blockKey}`,
      { method: 'PATCH', body: JSON.stringify({ media_url: publicUrl, updated_at: new Date().toISOString() }) }
    );
    // ローカルのstateも更新
    const k = `${state.page}.${state.section}.${blockKey}`;
    state.allData[k] = { ...state.allData[k], media: publicUrl };
    renderBlocks();
    showToast('✓ アップロード完了！サイトに反映されました', 'success');
  } catch(e) {
    console.error(e);
    showToast('エラーが発生しました', '');
  }
}

async function updateValue(page, section, key, value) {
  await sbFetch(
    `/rest/v1/site_contents?page=eq.${page}&section=eq.${section}&block_key=eq.${key}`,
    { method: 'PATCH', body: JSON.stringify({ text_value: value, updated_at: new Date().toISOString() }) }
  );
  state.allData[`${page}.${section}.${key}`] = { text: value, updated_at: new Date().toISOString() };
}

// ========== ナビゲーション ==========
function selectPage(pageId, pageName) {
  state.page = pageId;
  state.pageName = pageName;
  updateBreadcrumb();
  showView('sections');
  renderSections();
}

function selectSection(sectionId, sectionName) {
  state.section = sectionId;
  state.sectionName = sectionName;
  updateBreadcrumb();
  showView('blocks');
  renderBlocks();
}

function goBack(level) {
  if (level === 'pages') {
    state.page = null; state.section = null;
    showView('pages');
  } else if (level === 'sections') {
    state.section = null;
    showView('sections');
    renderSections();
  }
  updateBreadcrumb();
}

function showView(name) {
  ['pages','sections','blocks'].forEach(v => {
    document.getElementById(`view-${v}`).style.display = v === name ? 'block' : 'none';
  });
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let html = `<span class="breadcrumb-item ${!state.page ? 'current' : ''}" onclick="goBack('pages')">ページ選択</span>`;
  if (state.page) {
    html += `<span class="breadcrumb-sep">›</span>`;
    html += `<span class="breadcrumb-item ${!state.section ? 'current' : ''}" onclick="goBack('sections')">${state.pageName}</span>`;
  }
  if (state.section) {
    html += `<span class="breadcrumb-sep">›</span>`;
    html += `<span class="breadcrumb-item current">${state.sectionName}</span>`;
  }
  bc.innerHTML = html;
}

// ========== レンダリング ==========
function renderSections() {
  const sections = SECTIONS[state.page] || [];
  const label = document.getElementById('sections-label');
  label.textContent = `${state.pageName} — セクション選択`;
  const list = document.getElementById('section-list');
  list.innerHTML = sections.map(s => `
    <div class="section-item" onclick="selectSection('${s.id}','${s.name}')">
      <div class="section-item-left">
        <div class="section-icon">${s.icon}</div>
        <div>
          <div class="section-name">${s.name}</div>
          <div class="section-desc">${s.desc}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="section-badge">${s.blocks.length}</span>
        <span class="section-arrow">›</span>
      </div>
    </div>
  `).join('');
}

function renderBlocks() {
  const section = SECTIONS[state.page]?.find(s => s.id === state.section);
  if (!section) return;
  document.getElementById('blocks-label').textContent = `${state.pageName} › ${section.name}`;
  const list = document.getElementById('block-list');
  list.innerHTML = section.blocks.map(b => {
    const current = getValue(state.page, state.section, b.key);
    const currentMedia = getMediaValue(state.page, state.section, b.key);
    const isMedia = b.type === 'image' || b.type === 'video';
    const isEmpty = isMedia ? !currentMedia : !current;
    const badgeLabel = b.type === 'text' ? 'テキスト' : b.type === 'video' ? '動画' : '画像';
    const mediaPreview = isMedia && currentMedia ? (
      b.type === 'video'
        ? `<video src="${currentMedia}" style="width:100%;max-height:120px;object-fit:cover;border-radius:6px;margin-bottom:10px" muted playsinline></video>`
        : `<img src="${currentMedia}" style="width:100%;max-height:120px;object-fit:cover;border-radius:6px;margin-bottom:10px">`
    ) : '';
    return `
      <div class="block-card">
        <div class="block-card-head">
          <span class="block-type">${b.label}</span>
          <span class="block-type-badge ${b.type === 'text' ? 'text' : 'image'}">${badgeLabel}</span>
        </div>
        <div class="block-content">
          ${mediaPreview}
          <div class="block-current ${isEmpty ? 'empty' : ''}">${isEmpty ? '（未設定）' : isMedia ? '設定済み ✓' : escHtml(current)}</div>
          <div class="block-actions">
            ${isMedia ? `
              <label class="btn-edit" style="cursor:pointer">
                📁 ファイルを選択
                <input type="file" accept="${b.type === 'video' ? 'video/*' : 'image/*'}" style="display:none" onchange="uploadMedia(event,'${b.key}','${b.type}')">
              </label>
            ` : `
              <button class="btn-edit" onclick="openEdit('${b.key}','${b.label}')">✏️ 編集する</button>
              <button class="btn-ai" onclick="openEdit('${b.key}','${b.label}',true)">✦ クロに相談</button>
            `}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ========== 編集モーダル ==========
function openEdit(blockKey, blockLabel, focusAI = false) {
  state.editingBlock = blockKey;
  const current = getValue(state.page, state.section, blockKey);
  document.getElementById('modal-title').textContent = blockLabel;
  document.getElementById('modal-subtitle').textContent = `${state.pageName} › ${state.sectionName}`;
  document.getElementById('editTextarea').value = current;
  document.getElementById('aiChat').innerHTML = `<div class="ai-msg assistant">「${blockLabel}」について何でも相談してください！現在の内容をベースに改善案を提案することもできます。</div>`;
  hideApprove();
  document.getElementById('editModal').classList.add('open');
  if (focusAI) {
    setTimeout(() => document.getElementById('aiInput').focus(), 400);
  } else {
    setTimeout(() => document.getElementById('editTextarea').focus(), 400);
  }

  // テキスト変更で承認エリア更新
  document.getElementById('editTextarea').oninput = function() {
    state.pendingValue = this.value;
    if (this.value !== current) {
      showApprove(this.value);
    } else {
      hideApprove();
    }
  };
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  state.editingBlock = null;
  state.pendingValue = null;
}

// モーダル外クリックで閉じる
document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ========== 承認 ==========
function showApprove(value) {
  const area = document.getElementById('approveArea');
  document.getElementById('approvePreview').textContent = value.length > 80 ? value.slice(0,80) + '...' : value;
  area.style.display = 'block';
}

function hideApprove() {
  document.getElementById('approveArea').style.display = 'none';
}

async function approveChange() {
  const value = state.pendingValue || document.getElementById('editTextarea').value;
  if (!value || !state.editingBlock) return;
  const btn = document.getElementById('approveBtn');
  btn.disabled = true;
  btn.textContent = '反映中...';
  try {
    await updateValue(state.page, state.section, state.editingBlock, value);
    closeModal();
    renderBlocks();
    showToast('✓ サイトに反映しました！', 'success');
  } catch(e) {
    showToast('エラーが発生しました', '');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✓ 承認してサイトに反映';
  }
}

// ========== Claude AI ==========
async function sendAI() {
  const input = document.getElementById('aiInput');
  const msg = input.value.trim();
  if (!msg) return;
  const current = document.getElementById('editTextarea').value;
  const chat = document.getElementById('aiChat');
  const btn = document.getElementById('aiSendBtn');
  input.value = '';
  btn.disabled = true;
  // ユーザーメッセージ表示
  chat.innerHTML += `<div class="ai-msg user">👤 ${escHtml(msg)}</div>`;
  chat.innerHTML += `<div class="ai-msg loading" id="ai-loading">✦ クロが考えています...</div>`;
  chat.scrollTop = chat.scrollHeight;
  try {
    const res = await fetch(CLAUDE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: `あなたは沖縄の鉄工業「琉球鉄工株式会社」のホームページのCMS管理画面に組み込まれたアシスタントです。
ユーザーの指示に従って、ホームページの${state.sectionName}セクションの「${state.editingBlock}」ブロックのテキストを改善・生成してください。
現在のテキスト: 「${current}」
返答は改善案のテキストのみを返してください。説明や前置きは不要です。30文字〜150文字程度で簡潔に。`,
        messages: [{ role: 'user', content: msg }]
      })
    });
    const data = await res.json();
    const reply = data.text || '申し訳ありません、エラーが発生しました。';
    document.getElementById('ai-loading')?.remove();
    chat.innerHTML += `<div class="ai-msg assistant">✦ ${escHtml(reply)}</div>`;
    chat.scrollTop = chat.scrollHeight;
    // 提案をテキストエリアに反映
    document.getElementById('editTextarea').value = reply;
    state.pendingValue = reply;
    showApprove(reply);
  } catch(e) {
    document.getElementById('ai-loading')?.remove();
    chat.innerHTML += `<div class="ai-msg assistant">エラーが発生しました。もう一度お試しください。</div>`;
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

// ========== トースト ==========
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type}`;
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ========== ユーティリティ ==========
function updateLastUpdated(ts) {
  if (!ts) return;
  const d = new Date(ts);
  document.getElementById('last-updated').textContent = `最終更新: ${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ========== 初期化 ==========
async function init() {
  try {
    await loadAllData();
  } catch(e) {
    console.error('Init error:', e);
    showToast('データの読み込みに失敗しました', '');
  } finally {
    document.getElementById('loadingScreen').classList.add('hide');
  }
}

init();
</script>
